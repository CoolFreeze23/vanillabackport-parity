modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
enumExtensions="META-INF/enumextensions.json"

[[mixins]]
config="vbparity.garden.mixins.json"

[[mixins]]
config="vbparity.ghast.mixins.json"

[[mixins]]
config="vbparity.copper.mixins.json"

[[mixins]]
config="vbparity.mayhem.mixins.json"

[[mixins]]
config="vbparity.variants.mixins.json"

[[mixins]]
config="vbparity.sulfur.mixins.json"

[[mixins]]
config="vbparity.flora.mixins.json"

[[mixins]]
config="vbparity.misc.mixins.json"

[[mixins]]
config="vbparity.wild.mixins.json"

[[mixins]]
config="vbparity.shared.mixins.json"

[[mixins]]
config="vbparity.data.mixins.json"

[[mixins]]
config="vbparity.ai.mixins.json"


[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Exact VB version: every patch targets VB 1.2.2 code. A different VB build may need re-auditing.
[[dependencies.${mod_id}]]
modId="vanillabackport"
type="required"
versionRange="[${vb_version}]"
ordering="AFTER"
side="BOTH"
