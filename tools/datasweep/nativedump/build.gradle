java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
['262', '263'].each { v ->
    tasks.register("dump${v}", JavaExec) {
        dependsOn 'classes'
        classpath = sourceSets.main.output + configurations.getByName("mc${v}")
        mainClass = 'dump.NativeDump'
        args = ["out/native-${v}.json"]
        maxHeapSize = '3g'
    }
}
